<ng-template #tooltipContent>{{lastSelectValue}}</ng-template>
<div [id]="servoyApi().getMarkupId()" class="bts-combobox-container" ngbDropdown #comboboxDropdown="ngbDropdown" (openChange)="openChange($event)"
  [container]="$any(appendToBody()?'body':null)" #element>
  <button class="bts-combobox form-control dropdown-toggle bts-dropdown" ngbDropdownToggle
    [ngbTooltip]="tooltipContent"
    triggers="manual"
    #tooltip="ngbTooltip"
    [container]="$any(appendToBody()?'body':null)"
    [sabloTabseq]="tabSeq()"
    [svyTooltip]="toolTipText()"
    [svyStartEdit]="'dataProviderID'"
    [hostComponent]="this"
    [svyFormat]="$any(format())"
    [findmode]="$any(findmode())"
    [id]="servoyApi().getMarkupId() + '_btn'"
    #input>
    @if (showAsHtml()) {
      <span class="bts-dropdown-text" [class]="placeholderClass" [innerHtml]="formattedValue ? (formattedValue | htmlFilter | trustAsHtml:isTrustedHTML()) : formattedValue"></span>
    }
    @if (!showAsHtml()) {
      <span class="bts-dropdown-text" [class]="placeholderClass">{{formattedValue}}</span>
    }
  </button>
  <div
    ngbDropdownMenu
    [attr.aria-labelledby]="servoyApi().getMarkupId() + '_btn'"
    [style.width.px]="getDropDownWidth()"
    (keydown)="handleKeyDown($event)"
    #dropdown>
    @if (openState) {
      @for (value of valuelistID(); track value; let idx = $index) {
        <button
          ngbDropdownItem
          class="svy-ngbdropdownitem"
          [class.active]="valueComparator()(value)"
          (click)="updateValue(value.realValue, $event)">
          <!-- do not break the next line -->
          @if (showAsHtml()) {
            <span [innerHtml]="value.displayValue | formatFilter:$any(format()) | htmlFilter | trustAsHtml:isTrustedHTML() | emptyValue"></span>
          }
          @if (!showAsHtml()) {
            <span>{{getRemainingValueBefore(value.displayValue | formatFilter:$any(format()) | emptyValue)}}<strong>{{getStrongValue(value.displayValue | formatFilter:$any(format()) | emptyValue)}}</strong>{{getRemainingValueAfter(value.displayValue | formatFilter:$any(format()) | emptyValue)}}</span>
          }
        </button>
      }
    }
  </div>
</div>
